<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="نافذة استثمارية خاصة — ELAN Group United" />
  <title>نافذة الدخول السيادي في منظومة إيلان للتعدين الذكي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- الترويسة -->
  <header class="topbar">
    <div class="container">
      <span class="topbar__entity num" id="meta-entity"></span>
      <span class="topbar__privacy" id="meta-privacy"></span>
    </div>
  </header>

  <main>

    <!-- 1 — القسم الافتتاحي -->
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="container">
        <p class="hero__window-title" id="hero-window-title"></p>
        <h1 class="hero__title reveal" id="hero-title"></h1>
        <p class="hero__subtitle reveal" id="hero-subtitle"></p>
        <div class="hero__cards" id="hero-cards"></div>
        <p class="hero__note reveal" id="hero-note"></p>
        <p class="hero__status" id="hero-status"></p>
      </div>
    </section>

    <!-- 2 — لماذا يحتاج التعدين إلى نظام قرار -->
    <section class="section" id="problem" aria-labelledby="problem-heading">
      <div class="container">
        <p class="section__kicker">السياق</p>
        <h2 class="section__heading reveal" id="problem-heading"></h2>
        <p class="section__intro reveal" id="problem-intro"></p>
        <ul class="statements" id="problem-list"></ul>
      </div>
    </section>

    <!-- 3 — ما الذي تبنيه إيلان -->
    <section class="section section--graphite" id="definition" aria-labelledby="definition-heading">
      <div class="container">
        <p class="section__kicker">التعريف</p>
        <h2 class="section__heading reveal" id="definition-heading"></h2>
        <blockquote class="definition-quote reveal" id="definition-body"></blockquote>
        <p class="definition-support reveal" id="definition-support"></p>
      </div>
    </section>

    <!-- 4 — الطبقات الخمس -->
    <section class="section" id="layers" aria-labelledby="layers-heading">
      <div class="container">
        <p class="section__kicker">بنية المنظومة</p>
        <h2 class="section__heading reveal" id="layers-heading"></h2>
        <p class="section__intro reveal" id="layers-intro"></p>
        <div class="layers-grid" id="layers-grid"></div>
      </div>
    </section>

    <!-- 5 — استخدام رأس المال -->
    <section class="section section--dark" id="funds" aria-labelledby="funds-heading">
      <div class="container">
        <p class="section__kicker">خريطة رأس المال</p>
        <h2 class="section__heading reveal" id="funds-heading"></h2>
        <p class="section__intro reveal" id="funds-intro"></p>
        <div class="funds-layout">
          <div id="funds-wheel"></div>
          <div class="funds-grid" id="funds-grid"></div>
        </div>
        <p class="section__footnote reveal" id="funds-note"></p>
      </div>
    </section>

    <!-- 6 — منطق الإيراد -->
    <section class="section section--sand" id="revenue" aria-labelledby="revenue-heading">
      <div class="container">
        <p class="section__kicker">قنوات الدخل المحتملة</p>
        <h2 class="section__heading reveal" id="revenue-heading"></h2>
        <p class="section__intro reveal" id="revenue-intro"></p>
        <div class="revenue-grid" id="revenue-grid"></div>
      </div>
    </section>

    <!-- 7 — الأفق الزمني -->
    <section class="section section--dark" id="timeline" aria-labelledby="timeline-heading">
      <div class="container">
        <p class="section__kicker">رحلة القيمة</p>
        <h2 class="section__heading reveal" id="timeline-heading"></h2>
        <p class="section__intro reveal" id="timeline-intro"></p>
        <ol class="timeline" id="timeline-steps"></ol>
        <p class="section__footnote reveal" id="timeline-caution"></p>
      </div>
    </section>

    <!-- 8 — ما يحصل عليه المستثمر -->
    <section class="section" id="receives" aria-labelledby="receives-heading">
      <div class="container">
        <p class="section__kicker">حقوق المشاركة</p>
        <h2 class="section__heading reveal" id="receives-heading"></h2>
        <div class="receives-grid" id="receives-grid"></div>
      </div>
    </section>

    <!-- 9 — ما لا تتضمنه النافذة -->
    <section class="section section--graphite" id="not-receives" aria-labelledby="notreceives-heading">
      <div class="container">
        <p class="section__kicker">حدود الطرح</p>
        <h2 class="section__heading reveal" id="notreceives-heading"></h2>
        <p class="section__intro reveal" id="notreceives-intro"></p>
        <ul class="not-list" id="notreceives-list"></ul>
      </div>
    </section>

    <!-- 10 — المخاطر والحوكمة -->
    <section class="section" id="risks" aria-labelledby="risks-heading">
      <div class="container">
        <p class="section__kicker">الانضباط</p>
        <h2 class="section__heading reveal" id="risks-heading"></h2>
        <p class="section__intro reveal" id="risks-intro"></p>
        <div class="risks-grid" id="risks-grid"></div>
      </div>
    </section>

    <!-- 11 — طبقة التعمق المالي -->
    <section class="section section--dark" id="deep-dive" aria-labelledby="deepdive-heading">
      <div class="container">
        <p class="section__kicker">المراجعة التفصيلية</p>
        <h2 class="section__heading reveal" id="deepdive-heading"></h2>
        <p class="section__intro reveal" id="deepdive-intro"></p>
        <div class="deepdive-list" id="deepdive-list"></div>
      </div>
    </section>

    <!-- 12 — الخطوة التالية -->
    <section class="section cta" id="next-step" aria-labelledby="cta-content">
      <div class="container" id="cta-content"></div>
    </section>

  </main>

  <!-- التذييل -->
  <footer class="footer">
    <div class="container">
      <span class="footer__entity" id="footer-entity"></span>
      <p id="footer-status"></p>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
